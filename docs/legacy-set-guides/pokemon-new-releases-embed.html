<style>
.wposb-root{--bg:#0e1b2c;--panel:#0f2136;--panel2:#102238;--border:rgba(255,255,255,.08);--text:#fff;--dim:rgba(255,255,255,.55);--gold:#ffd166;--g:#00d68f;font-family:Arial,Helvetica,sans-serif;color:var(--text);}
.wposb-root *{box-sizing:border-box;}
.wposb-wrap{max-width:1280px;margin:0 auto;padding:18px;}
.wposb-set-row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:12px;margin-bottom:14px;}
.wposb-set-row select,.wposb-set-row input{background:#0b1a2b;color:#fff;border:1px solid #28496f;border-radius:8px!important;padding:9px 12px!important;font-size:14px!important;height:44px!important;line-height:24px!important;min-height:0!important;}
.wposb-set-row select{flex:1 1 260px;min-width:200px;width:auto;}
.wposb-set-row input{flex:1 1 160px;min-width:140px;width:auto;}
.wposb-toolbar{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center;margin-bottom:10px;}
.wposb-stats{font-family:monospace;font-size:11px;color:var(--dim);display:flex;gap:12px;flex-wrap:wrap;align-items:center;}
.wposb-sort-row{display:flex;flex-wrap:wrap;gap:6px;align-items:center;}
.wposb-root button,.wposb-root input,.wposb-root select{width:auto;box-sizing:border-box;}
.wposb-btn{display:inline-flex!important;align-items:center;justify-content:center;width:auto!important;flex:0 0 auto;background:#132943;border:1px solid #28496f;color:#fff;border-radius:8px;padding:6px 11px;font-size:10px;font-family:monospace;cursor:pointer;letter-spacing:.03em;white-space:nowrap;}
.wposb-btn:hover{background:#1c3a5c;}
.wposb-btn.active{border-color:var(--gold);color:var(--gold);}
.wposb-btn.accent{border-color:rgba(0,214,143,.5);color:var(--g);}
.wposb-filters{display:none;flex-wrap:wrap;gap:8px;background:var(--panel2);border:1px solid var(--border);border-radius:10px;padding:10px;margin-bottom:12px;}
.wposb-filters.on{display:flex;}
.wposb-filters input,.wposb-filters select{background:#0b1a2b;color:#fff;border:1px solid #28496f;border-radius:8px;padding:7px 10px;font-size:12px;flex:1 1 140px;min-width:110px;max-width:220px;height:36px;}
.wposb-chip{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:999px;border:1px solid rgba(255,255,255,.15);background:rgba(255,255,255,.06);font-size:11px;cursor:pointer;user-select:none;font-family:monospace;}
.wposb-chip.active{border-color:var(--g);color:var(--g);background:rgba(0,214,143,.1);}
.wposb-cards-area{display:grid;grid-template-columns:repeat(auto-fill,minmax(var(--card-min,280px),1fr));gap:14px;}
.wposb-card{background:var(--panel);border:1px solid var(--border);border-radius:12px;overflow:hidden;display:flex;flex-direction:column;transition:border-color .15s,transform .15s;}
.wposb-card:hover{border-color:rgba(255,209,102,.4);transform:translateY(-2px);}
.wposb-card-img-wrap{aspect-ratio:5/7;background:#0a1420;display:flex;align-items:center;justify-content:center;}
.wposb-card-img{width:100%;height:100%;object-fit:contain;}
.wposb-no-img{width:100%;height:100%;background:linear-gradient(135deg,#152a42,#0a1420);}
.wposb-card-body{padding:10px 12px 12px;display:flex;flex-direction:column;gap:5px;}
.wposb-card-name{font-weight:700;font-size:13px;line-height:1.3;}
.wposb-card-num{color:var(--dim);font-weight:400;font-size:11px;}
.wposb-card-meta{font-size:11px;color:var(--dim);}
.wposb-card-prices{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
.wposb-price{font-weight:800;color:var(--gold);font-size:14px;}
.wposb-price-low{font-size:10px;color:var(--dim);}
.wposb-card-actions{margin-top:4px;}
.wposb-card-actions .wposb-btn{width:100%!important;text-align:center;}
.wposb-sort-row .wposb-btn,.wposb-toolbar label{flex:0 0 auto;}
.wposb-sort-row input[type="range"]{width:90px;}
.wposb-empty{grid-column:1/-1;text-align:center;padding:40px 16px;color:var(--dim);font-family:monospace;font-size:12px;}
.wposb-loading{color:var(--gold);}
.wposb-tbl-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:10px;}
.wposb-table{width:100%;border-collapse:collapse;font-size:12px;}
.wposb-th{text-align:left;padding:8px 10px;background:var(--panel2);color:var(--dim);font-family:monospace;font-size:10px;letter-spacing:.04em;cursor:pointer;white-space:nowrap;}
.wposb-th.active{color:var(--gold);}
.wposb-td{padding:7px 10px;border-top:1px solid var(--border);white-space:nowrap;}
.wposb-tr:hover{background:rgba(255,255,255,.03);}
.wposb-swipe-stage{position:relative;max-width:340px;margin:0 auto;aspect-ratio:5/7;touch-action:pan-y;}
.wposb-swipe-slide{position:absolute;inset:0;border-radius:14px;overflow:hidden;background:#0a1420;box-shadow:0 12px 30px rgba(0,0,0,.5);will-change:transform;}
.wposb-swipe-slide img{width:100%;height:100%;object-fit:contain;background:#0a1420;}
.wposb-swipe-arrows{position:absolute;top:50%;left:-14px;right:-14px;display:flex;justify-content:space-between;transform:translateY(-50%);pointer-events:none;z-index:200;}
.wposb-swipe-arrow{pointer-events:auto;background:rgba(0,0,0,.55);border:1px solid rgba(255,255,255,.25);color:#fff;width:38px;height:38px;border-radius:50%;font-size:20px;cursor:pointer;}
.wposb-dots{display:flex;justify-content:center;gap:6px;margin-top:14px;flex-wrap:wrap;max-width:340px;margin-left:auto;margin-right:auto;}
.wposb-dot{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.25);cursor:pointer;}
.wposb-dot.on{background:var(--gold);}
.wposb-swipe-info{max-width:400px;margin:14px auto 0;text-align:center;}
.wposb-swipe-name{font-size:16px;font-weight:800;}
@media(max-width:640px){
.wposb-set-row{flex-direction:column;align-items:stretch;}
.wposb-cards-area{grid-template-columns:repeat(auto-fill,minmax(140px,1fr))!important;gap:10px;}
.wposb-swipe-stage{max-width:280px;}
.wposb-dots,.wposb-swipe-info{max-width:280px;}
}
</style>
<div class="wposb-root" data-wposb-root>
<div class="wposb-wrap">
<div class="wposb-set-row">
<select id="wposb-set-sel">
<option value="">Loading sets…</option>
</select>
<input id="wposb-set-search" placeholder="Search sets…">
</div>
<div id="wposb-content">
<div class="wposb-empty">Select a Pokémon set above to browse every card.</div>
</div>
</div>
</div>
<script>
(function(){
  const PPT_WORKER = 'https://still-resonance-4f87.swarnerauto.workers.dev';
  const TCG_API = 'https://api.pokemontcg.io/v2';
  const TCG_KEY = ''; // removed from this backup
  const st = {
    sets: [], selectedSet: null, cards: [], filteredCards: [],
    sortField:'number', sortDir:1, view: window.innerWidth <= 640 ? 'swipe' : 'cards', cardSize:280, tableImgSize:84,
    filters:{ name:'', artist:'', rarity:'', minPrice:'', maxPrice:'' },
    filterOpen:false, swipeIdx:0, isDragging:false, dragX:0, usingWorker:true
  };
  function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
  function affTcg(url){
    if(!url) return '';
    return 'https://partner.tcgplayer.com/k443Ov?u=' + encodeURIComponent(url);
  }
  function parseNum(n){
    const s = String(n||'').trim();
    const m = s.match(/^0*(\d+)/);
    return m ? parseInt(m[1],10) : 999999;
  }
  function init(){
    const root = document.querySelector('[data-wposb-root]');
    if(!root) return;
    const sel = root.querySelector('#wposb-set-sel');
    const search = root.querySelector('#wposb-set-search');
    sel.addEventListener('change', onSelectSet);
    search.addEventListener('input', () => filterSetDropdown(search.value));
    loadSets();
  }
  async function loadSets(){
    const sel = document.getElementById('wposb-set-sel');
    try{
      const cacheKey = 'wposb_sets_v1';
      const cached = JSON.parse(localStorage.getItem(cacheKey) || 'null');
      if(cached && (Date.now() - (cached.ts||0)) < 86400000 && cached.sets?.length){
        st.sets = cached.sets; st.usingWorker = cached.usingWorker;
        populateSetDropdown(); return;
      }
      const res = await fetch(PPT_WORKER + '/pricing/pokemon/sets?sortBy=releaseDate&sortOrder=desc&limit=400', {cache:'no-store'});
      if(!res.ok) throw new Error('worker sets failed');
      const d = await res.json();
      const raw = Array.isArray(d.data) ? d.data : Array.isArray(d.sets) ? d.sets : [];
      if(!raw.length) throw new Error('worker sets empty');
      st.sets = raw.map(s => ({ id:s.name||s.id||'', name:s.name||'', releaseDate:s.releaseDate||'', cardCount:Number(s.cardCount||s.total||0) }))
        .sort((a,b)=> String(b.releaseDate||'').localeCompare(String(a.releaseDate||'')));
      st.usingWorker = true;
      try{ localStorage.setItem(cacheKey, JSON.stringify({ts:Date.now(), sets:st.sets, usingWorker:true})); }catch(e){}
      populateSetDropdown();
      return;
    }catch(e){ }
    try{
      const url = `${TCG_API}/sets?orderBy=-releaseDate&pageSize=250&select=id,name,releaseDate,series`;
      const res = await fetch(url, {mode:'cors', cache:'no-store'});
      const j = await res.json();
      st.sets = (j.data||[]).map(s => ({ id:s.id, name:s.name, releaseDate:s.releaseDate||'', cardCount:0 }));
      st.usingWorker = false;
      populateSetDropdown();
    }catch(e){
      sel.innerHTML = '<option value="">Could not load sets — click to retry</option>';
      sel.addEventListener('click', function once(){ sel.removeEventListener('click',once); loadSets(); }, {once:true});
    }
  }
  function populateSetDropdown(list){
    const sel = document.getElementById('wposb-set-sel');
    const sets = list || st.sets;
    sel.innerHTML = '<option value="">— Choose a set —</option>' + sets.map(s => {
      const year = s.releaseDate ? ' ('+String(s.releaseDate).slice(0,4)+')' : '';
      const count = s.cardCount ? ' · '+s.cardCount+' cards' : '';
      return `<option value="${esc(s.id)}" data-name="${esc(s.name)}">${esc(s.name)}${year}${count}</option>`;
    }).join('');
  }
  function filterSetDropdown(q){
    const fq = (q||'').toLowerCase().trim();
    const filtered = fq ? st.sets.filter(s => (s.name||'').toLowerCase().includes(fq)) : st.sets;
    populateSetDropdown(filtered);
  }
  async function onSelectSet(){
    const sel = document.getElementById('wposb-set-sel');
    const id = sel.value;
    const name = sel.options[sel.selectedIndex]?.getAttribute('data-name') || '';
    if(!id && !name) return;
    st.selectedSet = { id, name };
    st.cards = []; st.filteredCards = [];
    st.filters = { name:'', artist:'', rarity:'', minPrice:'', maxPrice:'' };
    st.sortField = 'number'; st.sortDir = 1;
    renderContent(true);
    try{
      st.cards = st.usingWorker ? await fetchCardsWorker(id||name) : await fetchCardsDirect(id||name);
      applyFilters();
      renderContent(false);
    }catch(e){
      document.getElementById('wposb-content').innerHTML =
        `<div class="wposb-empty" style="color:#ff8a8a">Error loading cards: ${esc(e.message)}<br><button class="wposb-btn" style="margin-top:10px" onclick="document.getElementById('wposb-set-sel').dispatchEvent(new Event('change'))">RETRY</button></div>`;
    }
  }
  async function fetchCardsWorker(setName){
    const params = new URLSearchParams({ set:setName, fetchAllInSet:'true', limit:'500' });
    const res = await fetch(PPT_WORKER + '/pricing/pokemon/cards?' + params.toString(), {cache:'no-store'});
    if(!res.ok) throw new Error('HTTP '+res.status);
    const d = await res.json();
    const cards = (Array.isArray(d.cards)&&d.cards.length ? d.cards : Array.isArray(d.data) ? d.data : d.results) || [];
    if(!cards.length) return fetchCardsDirect(setName);
    return cards.map(c => normalizeWorkerCard(c, setName));
  }
  function normalizeWorkerCard(c, setName){
    const market = c.prices?.market ?? c.marketPrice ?? c.price ?? 0;
    const low = c.prices?.lowPrice ?? c.lowPrice ?? 0;
    return {
      name: c.name || c.cardName || '', number: c.cardNumber || c.number || '',
      rarity: c.rarity || '', artist: c.artist || '',
      image: c.imageCdnUrl400 || c.imageCdnUrl200 || c.imageUrl || '',
      market: Number(market)||0, low: Number(low)||0,
      tcgUrl: affTcg(c.tcgPlayerUrl || (c.tcgPlayerId ? 'https://www.tcgplayer.com/product/'+encodeURIComponent(c.tcgPlayerId) : ''))
    };
  }
  async function fetchCardsDirect(setIdOrName){
    const isLikelyId = /^[a-z0-9]+$/i.test(setIdOrName) && setIdOrName.length <= 10 && !setIdOrName.includes(' ');
    const q = isLikelyId ? `set.id:"${setIdOrName}"` : `set.name:"${setIdOrName}"`;
    let all = [], page = 1;
    while(page <= 5){
      const url = `${TCG_API}/cards?q=${encodeURIComponent(q)}&orderBy=number&page=${page}&pageSize=250`;
      const res = await fetch(url, {headers:{'X-Api-Key':TCG_KEY,'Accept':'application/json'}, mode:'cors', cache:'no-store'});
      if(!res.ok) break;
      const d = await res.json();
      const batch = d.data || [];
      all = all.concat(batch);
      if(batch.length < 250) break;
      page++;
    }
    return all.map(c => ({
      name: c.name||'', number: c.number||'', rarity: c.rarity||'', artist: c.artist||'',
      image: c.images?.large || c.images?.small || '',
      market: pickTcgMarket(c.tcgplayer?.prices), low: pickTcgLow(c.tcgplayer?.prices),
      tcgUrl: affTcg(c.tcgplayer?.url || '')
    }));
  }
  function pickTcgMarket(prices){
    if(!prices) return 0;
    for(const k of ['normal','holofoil','reverseHolofoil','1stEditionHolofoil']){ if(prices[k]?.market) return prices[k].market; }
    return 0;
  }
  function pickTcgLow(prices){
    if(!prices) return 0;
    for(const k of ['normal','holofoil','reverseHolofoil']){ if(prices[k]?.low) return prices[k].low; }
    return 0;
  }
  function applyFilters(){
    let f = [...st.cards];
    const { name, artist, rarity, minPrice, maxPrice } = st.filters;
    if(name) f = f.filter(c => c.name.toLowerCase().includes(name.toLowerCase()));
    if(artist) f = f.filter(c => c.artist.toLowerCase().includes(artist.toLowerCase()));
    if(rarity) f = f.filter(c => c.rarity === rarity);
    if(Number(minPrice)>0) f = f.filter(c => c.market >= Number(minPrice));
    if(Number(maxPrice)>0) f = f.filter(c => c.market <= Number(maxPrice));
    f.sort(compareCards);
    st.filteredCards = f;
  }
  function compareCards(a,b){
    let r = 0;
    if(st.sortField==='number') r = parseNum(a.number) - parseNum(b.number);
    else if(st.sortField==='price') r = b.market - a.market;
    else if(st.sortField==='name') r = a.name.localeCompare(b.name);
    else if(st.sortField==='artist') r = a.artist.localeCompare(b.artist);
    else if(st.sortField==='rarity') r = a.rarity.localeCompare(b.rarity);
    return r * st.sortDir;
  }
  window.wposbSetSort = function(f){
    if(st.sortField===f) st.sortDir *= -1; else { st.sortField=f; st.sortDir=1; }
    applyFilters(); renderContent(false);
  };
  window.wposbSetFilter = function(k,v){ st.filters[k]=v; applyFilters(); renderContent(false); };
  window.wposbClearFilters = function(){ st.filters={name:'',artist:'',rarity:'',minPrice:'',maxPrice:''}; applyFilters(); renderContent(false); };
  window.wposbToggleFilters = function(){ st.filterOpen = !st.filterOpen; renderContent(false); };
  window.wposbToggleView = function(){
    const views=['cards','swipe','table']; st.view = views[(views.indexOf(st.view)+1)%3];
    renderContent(false);
  };
  window.wposbSetCardSize = function(v){ st.cardSize=Number(v); document.getElementById('wposb-cards-area')?.style.setProperty('--card-min', v+'px'); };
  window.wposbSetTableImgSize = function(v){
    st.tableImgSize = Number(v);
    document.querySelectorAll('.wposb-tbl-wrap img').forEach(img=>{ img.style.width=v+'px'; img.style.height=Math.round(v*1.39)+'px'; });
  };
  function renderContent(loading){
    const content = document.getElementById('wposb-content');
    if(!content) return;
    if(!st.selectedSet){ content.innerHTML = '<div class="wposb-empty">Select a set above.</div>'; return; }
    if(loading){ content.innerHTML = '<div class="wposb-empty wposb-loading">Loading cards…</div>'; return; }
    const { filteredCards, cards, view } = st;
    const isSwipe = view==='swipe', isTable = view==='table';
    const artists = [...new Set(cards.map(c=>c.artist).filter(Boolean))].sort();
    const rarities = [...new Set(cards.map(c=>c.rarity).filter(Boolean))].sort();
    const hasFilter = Object.values(st.filters).some(Boolean);
    const viewLabel = isSwipe ? 'TABLE' : isTable ? 'CARDS' : 'SWIPE';
    const sortBtn = (f,label) => `<button class="wposb-btn${st.sortField===f?' active':''}" onclick="wposbSetSort('${f}')">${label}${st.sortField===f?(st.sortDir>0?' ↑':' ↓'):''}</button>`;
    content.innerHTML = `
      <div class="wposb-toolbar">
        <div class="wposb-stats">
          <span style="color:#fff">${filteredCards.length}${filteredCards.length!==cards.length?'/'+cards.length:''} cards</span>
          <span>${esc(st.selectedSet.name)}</span>
          <span style="color:${st.usingWorker?'#00d68f':'#5ba3f5'}">${st.usingWorker?'Live pricing':'Card database'}</span>
        </div>
        <div class="wposb-sort-row">
          ${!isSwipe?`${sortBtn('number','#')}${sortBtn('price','PRICE')}${sortBtn('name','NAME')}${sortBtn('rarity','RARITY')}${sortBtn('artist','ARTIST')}`:''}
          <button class="wposb-btn" onclick="wposbToggleFilters()">FILTERS${hasFilter?' *':''}</button>
          <button class="wposb-btn accent" onclick="wposbToggleView()">${viewLabel}</button>
          ${!isSwipe&&!isTable?`<label style="display:flex;align-items:center;gap:5px;font-family:monospace;font-size:9px;color:var(--dim)">SIZE<input type="range" min="180" max="420" step="20" value="${st.cardSize}" oninput="wposbSetCardSize(this.value)"></label>`:''}
          ${isTable?`<label style="display:flex;align-items:center;gap:5px;font-family:monospace;font-size:9px;color:var(--dim)">IMG<input type="range" min="54" max="180" step="6" value="${st.tableImgSize}" oninput="wposbSetTableImgSize(this.value)"></label>`:''}
        </div>
      </div>
      <div class="wposb-filters${st.filterOpen?' on':''}">
        <input placeholder="Card name…" value="${esc(st.filters.name)}" oninput="wposbSetFilter('name',this.value)">
        <select onchange="wposbSetFilter('rarity',this.value)">
          <option value="">All rarities</option>
          ${rarities.map(r=>`<option value="${esc(r)}"${st.filters.rarity===r?' selected':''}>${esc(r)}</option>`).join('')}
        </select>
        <select onchange="wposbSetFilter('artist',this.value)">
          <option value="">All artists${artists.length?' ('+artists.length+')':''}</option>
          ${artists.map(a=>`<option value="${esc(a)}"${st.filters.artist===a?' selected':''}>${esc(a)}</option>`).join('')}
        </select>
        <input type="number" placeholder="Min $" style="width:70px" value="${esc(st.filters.minPrice)}" oninput="wposbSetFilter('minPrice',this.value)">
        <input type="number" placeholder="Max $" style="width:70px" value="${esc(st.filters.maxPrice)}" oninput="wposbSetFilter('maxPrice',this.value)">
        ${hasFilter?`<button class="wposb-btn" onclick="wposbClearFilters()">✕ CLEAR</button>`:''}
      </div>
      <div class="wposb-cards-area" id="wposb-cards-area" style="--card-min:${st.cardSize}px">
        ${!filteredCards.length ? '<div class="wposb-empty">No cards match filters.</div>'
          : isSwipe ? renderSwipe(filteredCards)
          : isTable ? renderTable(filteredCards)
          : renderGrid(filteredCards)}
      </div>`;
    if(isTable) content.querySelector('#wposb-cards-area').style.display = 'block';
    if(isSwipe) setTimeout(initSwipe, 50);
  }
  function renderGrid(cards){
    return cards.map((c,i) => `
      <div class="wposb-card">
        <div class="wposb-card-img-wrap">
          ${c.image ? `<img class="wposb-card-img" src="${esc(c.image)}" alt="${esc(c.name)}" loading="lazy">` : '<div class="wposb-no-img"></div>'}
        </div>
        <div class="wposb-card-body">
          <div class="wposb-card-name">${esc(c.name)} <span class="wposb-card-num">#${esc(c.number)}</span></div>
          <div class="wposb-card-meta">${esc(c.rarity)}${c.artist?' · '+esc(c.artist):''}</div>
          <div class="wposb-card-prices">
            <span class="wposb-price">${c.market?'$'+c.market.toFixed(2):'—'}</span>
            ${c.low&&c.low!==c.market?`<span class="wposb-price-low">Low $${c.low.toFixed(2)}</span>`:''}
          </div>
          <div class="wposb-card-actions">
            ${c.tcgUrl?`<button class="wposb-btn" style="width:100%" onclick="window.open('${esc(c.tcgUrl)}','_blank','noopener')">VIEW ON TCGPLAYER ↗</button>`:''}
          </div>
        </div>
      </div>`).join('');
  }
  function renderTable(cards){
    const rows = cards.map(c => `
      <tr class="wposb-tr">
        <td class="wposb-td">${c.image?`<img src="${esc(c.image)}" style="width:${st.tableImgSize}px;height:${Math.round(st.tableImgSize*1.39)}px;object-fit:contain;border-radius:4px" loading="lazy">`:''}</td>
        <td class="wposb-td">${esc(c.number)}</td>
        <td class="wposb-td">${esc(c.name)}</td>
        <td class="wposb-td">${esc(c.rarity)}</td>
        <td class="wposb-td">${esc(c.artist)}</td>
        <td class="wposb-td">${c.market?'$'+c.market.toFixed(2):'—'}</td>
        <td class="wposb-td">${c.tcgUrl?`<button class="wposb-btn" onclick="window.open('${esc(c.tcgUrl)}','_blank','noopener')">TCG ↗</button>`:''}</td>
      </tr>`).join('');
    return `<div class="wposb-tbl-wrap"><table class="wposb-table">
      <thead><tr>
        <th class="wposb-th">IMG</th>
        <th class="wposb-th${st.sortField==='number'?' active':''}" onclick="wposbSetSort('number')">#</th>
        <th class="wposb-th${st.sortField==='name'?' active':''}" onclick="wposbSetSort('name')">NAME</th>
        <th class="wposb-th${st.sortField==='rarity'?' active':''}" onclick="wposbSetSort('rarity')">RARITY</th>
        <th class="wposb-th${st.sortField==='artist'?' active':''}" onclick="wposbSetSort('artist')">ARTIST</th>
        <th class="wposb-th${st.sortField==='price'?' active':''}" onclick="wposbSetSort('price')">PRICE</th>
        <th class="wposb-th">LINK</th>
      </tr></thead>
      <tbody>${rows}</tbody>
    </table></div>`;
  }
  function renderSwipe(cards){
    st.swipeIdx = 0; st.isDragging = false; st.dragX = 0;
    const slides = cards.map(c => `<div class="wposb-swipe-slide">${c.image?`<img src="${esc(c.image)}" loading="lazy">`:'<div class="wposb-no-img"></div>'}</div>`).join('');
    const dots = cards.length <= 40
      ? `<div class="wposb-dots">${cards.map((_,i)=>`<span class="wposb-dot${i===0?' on':''}" onclick="wposbSwipeTo(${i})"></span>`).join('')}</div>`
      : `<div class="wposb-dots"><span id="wposb-swipe-ctr" style="font-family:monospace;font-size:11px;color:var(--dim)">1 / ${cards.length}</span></div>`;
    return `
      <div class="wposb-swipe-stage" id="wposb-deck-stage" style="cursor:grab">
        ${slides}
        <div class="wposb-swipe-arrows">
          <button class="wposb-swipe-arrow" onclick="wposbSwipeTo(${st.swipeIdx}-1)">&#8249;</button>
          <button class="wposb-swipe-arrow" onclick="wposbSwipeTo(${st.swipeIdx}+1)">&#8250;</button>
        </div>
      </div>
      ${dots}
      <div class="wposb-swipe-info" id="wposb-swipe-info">${swipeInfoHtml(0)}</div>`;
  }
  function swipeInfoHtml(idx){
    const c = st.filteredCards[idx];
    if(!c) return '';
    return `<div class="wposb-swipe-name">${esc(c.name)} <span class="wposb-card-num">#${esc(c.number)}</span></div>
      <div class="wposb-card-meta">${esc(c.rarity)}${c.artist?' · '+esc(c.artist):''}</div>
      <div class="wposb-card-prices" style="justify-content:center;margin:6px 0">
        <span class="wposb-price">${c.market?'$'+c.market.toFixed(2):'—'}</span>
      </div>
      ${c.tcgUrl?`<button class="wposb-btn" onclick="window.open('${esc(c.tcgUrl)}','_blank','noopener')">VIEW ON TCGPLAYER ↗</button>`:''}`;
  }
  function deckTransforms(){
    const slides = [...document.querySelectorAll('.wposb-swipe-slide')];
    const stage = document.getElementById('wposb-deck-stage');
    const W = stage?.offsetWidth || 340;
    const dragProg = Math.min(1, Math.abs(st.dragX)/(W*0.55));
    slides.forEach((slide,i) => {
      const offset = i - st.swipeIdx;
      if(offset < -0.5){ slide.style.cssText='opacity:0;z-index:0;transform:translateX(-200%) rotate(-30deg);transition:none;'; return; }
      if(offset <= 0.5 && st.isDragging){
        const rot = st.dragX*0.04, ty = Math.abs(st.dragX)*0.06, op = Math.max(0.15, 1-Math.abs(st.dragX)/(W*0.9));
        slide.style.cssText = `z-index:100;opacity:${op.toFixed(2)};transition:none;transform:translateX(${st.dragX.toFixed(1)}px) translateY(-${ty.toFixed(1)}px) rotate(${rot.toFixed(2)}deg);`;
        return;
      }
      const eff = Math.max(0, offset - (st.isDragging?dragProg:0));
      const scale = Math.max(0.68, 1-eff*0.09), ty = eff*24, rot = -eff*2.5;
      const op = offset>3 ? 0 : Math.max(0, 1-Math.max(0,eff-0.4)*0.5);
      const zi = Math.max(0, 100-Math.round(offset)*10);
      slide.style.cssText = `z-index:${zi};opacity:${op.toFixed(2)};`+(st.isDragging?'transition:none;':'transition:transform .35s cubic-bezier(.25,.46,.45,.94),opacity .35s ease;')+`transform:scale(${scale.toFixed(3)}) translateY(${ty.toFixed(1)}px) rotate(${rot.toFixed(2)}deg);`;
    });
  }
  window.wposbSwipeTo = function(idx){
    const cards = st.filteredCards;
    idx = Math.max(0, Math.min(cards.length-1, idx));
    st.swipeIdx = idx; st.isDragging = false; st.dragX = 0;
    deckTransforms();
    document.querySelectorAll('.wposb-dot').forEach((d,i)=>d.classList.toggle('on', i===idx));
    const ctr = document.getElementById('wposb-swipe-ctr'); if(ctr) ctr.textContent = `${idx+1} / ${cards.length}`;
    const info = document.getElementById('wposb-swipe-info'); if(info) info.innerHTML = swipeInfoHtml(idx);
  };
  function flyOrSnap(dx, W){
    const threshold = W*0.28;
    if(Math.abs(dx) > threshold){
      const dir = dx<0?-1:1;
      const slides = document.querySelectorAll('.wposb-swipe-slide');
      const cur = slides[st.swipeIdx];
      if(cur){
        cur.style.transition = 'transform .28s ease, opacity .28s ease';
        cur.style.transform = `translateX(${dir*-140}%) rotate(${dir*-22}deg) scale(0.75)`;
        cur.style.opacity = '0';
        setTimeout(()=>wposbSwipeTo(st.swipeIdx + (dir<0?1:-1)), 80);
        return;
      }
    }
    wposbSwipeTo(st.swipeIdx);
  }
  function initSwipe(){
    const stage = document.getElementById('wposb-deck-stage');
    if(!stage || stage._ok) return;
    stage._ok = true;
    let tx0=0, ty0=0, drag=false, isH=false;
    stage.addEventListener('touchstart', e=>{tx0=e.touches[0].clientX;ty0=e.touches[0].clientY;drag=true;isH=false;},{passive:true});
    stage.addEventListener('touchmove', e=>{
      if(!drag) return;
      const dx=e.touches[0].clientX-tx0, dy=e.touches[0].clientY-ty0;
      if(!isH){ if(Math.abs(dx)>Math.abs(dy)&&Math.abs(dx)>8) isH=true; else if(Math.abs(dy)>12){drag=false;return;} }
      if(!isH) return;
      e.preventDefault();
      st.isDragging=true; st.dragX=dx; deckTransforms();
    },{passive:false});
    stage.addEventListener('touchend', e=>{
      if(!drag) return; drag=false;
      flyOrSnap(e.changedTouches[0].clientX-tx0, stage.offsetWidth);
    },{passive:true});
    let mx0=0, mDn=false;
    stage.addEventListener('mousedown', e=>{mDn=true;mx0=e.clientX;stage.style.cursor='grabbing';});
    window.addEventListener('mouseup', e=>{ if(!mDn) return; mDn=false; stage.style.cursor='grab'; flyOrSnap(e.clientX-mx0, stage.offsetWidth); });
    window.addEventListener('mousemove', e=>{ if(!mDn) return; st.isDragging=true; st.dragX=e.clientX-mx0; deckTransforms(); });
    wposbSwipeTo(0);
  }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded', init);
  else init();
})();
</script>
